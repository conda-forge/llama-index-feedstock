schema_version: 1

context:
  name: llama-index
  version: 0.14.25

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/llama_index-${{ version }}.tar.gz
  sha256: 242269bf0dec5f73733572d10866b34aba86f049549fd97612f554461f549e68

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - llama-index-core >=0.14.25,<0.15.0
    - llama-index-embeddings-openai >=0.6.0,<0.7
    - llama-index-llms-openai >=0.7.0,<0.8
    - nltk >=3.9.3
tests:
  - python:
      imports:
        - llama_index
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Interface between LLMs and your data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/run-llama/llama_index

extra:
  recipe-maintainers:
    - jan-janssen
    - pavelzw
